name = "crypt-api-worker"
main = "src/entry.py"
compatibility_date = "2026-02-16"
compatibility_flags = ["python_workers"]

[vars]
RATE_LIMIT_PER_SECOND = "3"

[[kv_namespaces]]
binding = "MESSAGES"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"  # REQUIRED: Set this to your actual KV namespace ID from Cloudflare dashboard before deploying
